name: Build APK with Buildozer (ML Kit + Pyzbar)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TERM: dumb

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure entry file exists
      run: |
        if [ ! -f "main.py" ]; then
          echo "❌ ERROR: main.py not found"
          ls -l
          exit 1
        fi
        echo "✅ main.py found."

    - name: Create required assets
      run: |
        if [ ! -f "wifi_printers.json" ]; then
          echo '[]' > wifi_printers.json
          echo "✅ Created wifi_printers.json"
        fi
        if [ ! -f "icon.png" ]; then
          echo "⚠️ Warning: icon.png not found. Creating placeholder..."
          convert -size 512x512 xc:blue icon.png || echo "⚠️ ImageMagick not installed"
        fi
        if [ ! -f "android-permissions.xml" ]; then
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' > android-permissions.xml
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> android-permissions.xml
          printf '%s\n' '    package="org.example.orderprinter">' >> android-permissions.xml
          printf '%s\n' '    <uses-permission android:name="android.permission.CAMERA" />' >> android-permissions.xml
          printf '%s\n' '    <uses-feature android:name="android.hardware.camera" android:required="false" />' >> android-permissions.xml
          printf '%s\n' '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' >> android-permissions.xml
          printf '%s\n' '</manifest>' >> android-permissions.xml
          echo "✅ Created android-permissions.xml"
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          libffi-dev libssl-dev libsqlite3-dev \
          libjpeg-dev libfreetype6-dev zlib1g-dev \
          automake autoconf libtool libtool-bin autopoint gettext pkg-config \
          m4 autoconf-archive make cmake ninja-build \
          imagemagick
        sudo mkdir -p /usr/share/aclocal

        # =========================================================
        # FIX LỖI PIP
        # =========================================================
        python -m pip install --upgrade pip==23.3.2
        python -m pip install --upgrade setuptools==69.0.3 wheel
        python -m pip install Cython==0.29.36
        python -m pip install buildozer==1.4.0

    - name: Patch libtool / autoconf
      run: |
        sudo ln -sf /usr/bin/libtoolize /usr/bin/libtool || true
        echo "m4_pattern_allow([^LT_SYS_SYMBOL_USCORE$])" | sudo tee -a /usr/share/aclocal/libtool.m4 > /dev/null
        echo "m4_pattern_allow([^_LT_PROG_LTMAIN$])" | sudo tee -a /usr/share/aclocal/libtool.m4 > /dev/null

    - name: Cache Buildozer & SDK/NDK
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-${{ runner.os }}-

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Install Android SDK & NDK manually
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        if [ ! -d "android-sdk/cmdline-tools/latest" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d android-sdk
          mkdir -p android-sdk/cmdline-tools/latest
          mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          mkdir -p android-sdk/tools/bin
          ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
                 $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        fi
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true
        $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
          "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
        if [ ! -d "android-ndk-r25b" ]; then
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip
        fi
        mkdir -p android-ndk
        rsync -a android-ndk-r25b/ android-ndk/
        echo "✅ SDK and NDK installed"

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Order Printer
        package.name = orderprinter
        package.domain = org.example

        source.dir = .
        source.include_exts = py,png,jpg,jpeg,ttf,xml,json
        icon.filename = %(source.dir)s/icon.png

        version = 1.0.0

        orientation = portrait
        fullscreen = 0

        # =========================================================
        # CHỈ ML KIT + PYZBAR (KHÔNG OPENCV)
        # =========================================================
        requirements = python3,kivy,pyjnius,pillow,plyer,pyzbar,camera4kivy,gestures4kivy

        android.permissions = CAMERA,INTERNET,ACCESS_NETWORK_STATE,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN,ACCESS_FINE_LOCATION

        android.manifest = android-permissions.xml
        android.manifest.extra = 
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

        android.add_assets = wifi_printers.json

        presplash.filename = %(source.dir)s/icon.png
        android.presplash_color = #FFFFFF

        android.api = 34
        android.minapi = 21
        android.ndk = 25b
        android.ndk_api = 21
        android.archs = arm64-v8a

        # =========================================================
        # P4A CONFIG: BOOTSTRAP + COMMIT
        # =========================================================
        p4a.branch = master
        p4a.bootstrap = sdl2
        # p4a.commit = v2024.01.21
        p4a.hook = camerax_provider/gradle_options.py

        android.allow_backup = True
        android.enable_androidx = True

        # =========================================================
        # GRADLE CHO ML KIT
        # =========================================================
        android.gradle_repositories = maven { url 'https://maven.google.com' }, google(), mavenCentral()

        android.gradle_dependencies = com.google.mlkit:barcode-scanning:17.2.0, androidx.appcompat:appcompat:1.6.1

        exclude_patterns = tests,docs,*.pyc,*.pyo,*.md,__pycache__,.git

        environment = 
            PYTHONOPTIMIZE=2
            KIVY_METRICS_DENSITY=2

        [buildozer]
        log_level = 2
        warn_on_root = 1
        android.accept_sdk_license = True
        EOF
        echo "📄 buildozer.spec created"

    - name: Clean previous builds
      run: |
        buildozer android clean || true
        rm -rf ~/.buildozer/android/platform/build-* || true

    # =========================================================
    # THÊM CÁC BƯỚC MỚI VÀO ĐÂY (KHÔNG SỬA GÌ CŨ)
    # =========================================================
    - name: Install Android SDK 34 (bổ sung)
      run: |
        $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" "build-tools;34.0.0" || true

    - name: Patch Gradle compileSdk to 34
      run: |
        DIST_DIR=".buildozer/android/platform/build-arm64-v8a/dists/orderprinter"
        BUILD_GRADLE="$DIST_DIR/app/build.gradle"
        if [ -f "$BUILD_GRADLE" ]; then
          echo "✅ Found build.gradle, patching..."
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$BUILD_GRADLE"
          sed -i 's/compileSdk [0-9]*/compileSdk 34/g' "$BUILD_GRADLE"
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' "$BUILD_GRADLE"
          sed -i 's/targetSdk [0-9]*/targetSdk 34/g' "$BUILD_GRADLE"
          echo "✅ Patched to compileSdk=34"
        else
          echo "⚠️ build.gradle not found at $BUILD_GRADLE"
        fi

    - name: Debug Gradle (nếu vẫn lỗi)
      if: always()
      run: |
        DIST_DIR=".buildozer/android/platform/build-arm64-v8a/dists/orderprinter"
        if [ -d "$DIST_DIR" ]; then
          cd "$DIST_DIR"
          ./gradlew clean assembleDebug --stacktrace --info --warning-mode all || true
        else
          echo "⚠️ DIST_DIR not found, skipping debug"
        fi

    - name: Build APK
      run: |
        export PATH="$HOME/.buildozer/android/platform/android-sdk/tools/bin:$PATH"
        export PATH="$HOME/.buildozer/android/platform/android-sdk/platform-tools:$PATH"
        export PATH="$HOME/.buildozer/android/platform/android-ndk-r25b:$PATH"
        unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
        mkdir -p build-logs
        
        # =========================================================
        # 🔥 GHI ĐÈ URL CHO FREETYPE VÀ LIBICONV
        # =========================================================
        export URL_freetype="https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz"
        export URL_libiconv="https://mirrors.kernel.org/gnu/libiconv/libiconv-1.16.tar.gz"

        echo "🚀 Starting build (ML Kit + Pyzbar)..."
        buildozer -v android debug 2>&1 | tee build-logs/build-error-log.txt

    - name: Find and copy APK
      run: |
        echo "🔍 Searching for APK..."
        APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "✅ Found APK at: $APK_PATH"
          mkdir -p bin
          cp "$APK_PATH" bin/app.apk
          ls -la bin/
        else
          echo "❌ No APK found!"
          echo "📁 Checking build directory..."
          find ~/.buildozer -name "*.apk" 2>/dev/null || echo "No APK found"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: orderprinter-app
        path: bin/app.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build-logs/
        retention-days: 7

    - name: Notify result
      if: always()
      run: |
        if [ -f "bin/app.apk" ]; then
          echo "🎉 APK built successfully!"
        else
          echo "❌ Build failed. Check build-logs artifact"
        fi
